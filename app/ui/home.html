<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decks</title>
<link rel="stylesheet" href="/ui/home.css">
</head>
<body>
<main>
  <h1>Decks</h1>

  <form id="open-form">
    <input id="path" type="text" autocomplete="off" spellcheck="false" aria-label="Path to a deck folder or a .deck file" placeholder="Path to a deck folder or a .deck file">
    <button type="submit">Open</button>
    <label class="button">Choose a .deck file<input id="file" type="file" accept=".deck,.zip" hidden></label>
  </form>
  <p id="message" role="status" hidden></p>

  <ul id="decks"></ul>
  <p id="empty" hidden>No decks are open. Open one by its path, or drop a .deck file anywhere on this page.</p>
</main>
<div id="drop" hidden>Drop the .deck file to open it</div>
<script type="module" src="/ui/home.js"></script>
</body>
</html>
