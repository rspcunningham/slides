<p class="eyebrow">The idea</p>
<p class="big">Treat the sample as the weights of a model, and the microscope as its architecture.</p>
<p class="lede" style="width:1300px;">A differentiable simulation of the optics predicts every capture. Gradient descent updates the sample until the predictions match what the sensor recorded.</p>
