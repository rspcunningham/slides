<p class="eyebrow">The real question the optimizer answers</p>
<p class="quote">Not “what is the sample?” but “what sample would make a perfect microscope produce these images?”</p>
<p class="lede" style="color:#E3ECF5; width:1300px;">That sample doesn’t exist, so the optimizer invents one.</p>
